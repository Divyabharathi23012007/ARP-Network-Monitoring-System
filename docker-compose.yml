services:
  arp-network-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: arp-network-monitor:latest
    container_name: arp-network-monitor-app
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/topology || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
